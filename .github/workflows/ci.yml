name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      YELLO_LOCAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      YELLO_LOCAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A conta de exemplo abastece a vitrine e a caixa de entrada dos testes.
      - run: npm run db:seed
      # O teste de ondas em WebGL é sensível a paralelismo; a suíte roda em série.
      - run: npm run test:e2e -- --workers=1
